name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run `npm publish --dry-run` instead of a real publish.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    name: Publish io.embrace.sdk to npm
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=22.14.0' # minimum for npm trusted publishing support
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        # Trusted publishing requires npm >=11.5.1.
        run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] - pinned version, upgrading npm itself so no lockfile applies

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./io.embrace.sdk/package.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' from io.embrace.sdk/package.json is not a valid semantic version" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Download iOS dependencies
        # Normally handled by the prepublishOnly script, but the package
        # contents need to exist on disk before `npm pack` below can inspect
        # them.
        run: make install_ios_dependencies

      - name: Validate every packaged file has a matching .meta file
        # Unity refuses to import an asset with no .meta file when the
        # package lives in the immutable package cache, so a missing .meta
        # breaks every consumer's project. Catch that (and orphan .meta
        # files with no matching asset) before publishing.
        working-directory: io.embrace.sdk
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/npm-pack.json
          python3 ../.github/scripts/check_meta_files.py /tmp/npm-pack.json

      - name: Publish to npm
        # prepublishOnly (make install_ios_dependencies) runs automatically as
        # part of `npm publish` — see io.embrace.sdk/package.json.
        working-directory: io.embrace.sdk
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run complete for io.embrace.sdk@$VERSION. No package was published."
          else
            echo "Published io.embrace.sdk@$VERSION to https://www.npmjs.com/package/io.embrace.sdk"
          fi
